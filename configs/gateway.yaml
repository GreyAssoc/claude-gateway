# Gateway configuration
# Cron schedules use standard cron syntax: min hour day month weekday

database:
  path: "data/gateway.db"

skills:
  dirs:
    - "harness/skills"   # framework-agnostic (Gmail, Calendar, …) — every model
    - "skills"           # workspace / Claude Code skills (mounted from .claude/skills)
  agent_dirs:
    - "/app/agents"      # .claude/agents (folder chat agents + leftover DNA)
    - "/workspace/.claude/agents"

memory:
  bootstrap_dir: "memory/bootstrap"
  profiles_dir: "memory/profiles"
  daily_dir: "memory/daily"
  max_curated_inject: 20
  max_daily_days: 7
  claude_md_paths:
    - "/workspace/CLAUDE.md"
    - "/workspace/projects/CLAUDE.md"

orchestrator:
  # Coding review teams: workspace/.claude/teams/coding/…
  # Design/research DNA may still live under .claude/agents/.
  agent_dna_dir: "/app/teams"
  timeout_seconds: 3600

dashboard:
  enabled: true
  port: 8080

# All cron jobs (YAML and /cronadd) run on CRON_FRAMEWORK (default qwen),
# not the Telegram /framework switch.
cron:
  morning_briefing:
    schedule: "0 7 * * 1-5"
    prompt: >
      Check my Gmail for urgent unread messages from the last 12 hours,
      check my calendar for today's events, and give me a concise morning
      briefing. Keep it short — bullet the top 3 priorities.
    enabled: true

  end_of_day:
    schedule: "0 18 * * 1-5"
    prompt: >
      Summarize what happened today: important emails received, calendar
      events completed, and any action items I should follow up on tomorrow.
    enabled: true

  weekly_review:
    schedule: "0 9 * * 1"
    prompt: >
      Check my Google Drive for files modified in the last week in my
      Projects folder. Summarize key changes and flag anything that
      needs attention this week.
    enabled: true

  memory_compaction:
    schedule: "0 0 * * *"
    prompt: "__INTERNAL_MEMORY_COMPACT__"
    enabled: true

watchers:
  gmail:
    enabled: false
    interval_seconds: 120
    prompt: >
      Check Gmail for messages received after {since}. If there are none,
      reply with exactly "NONE". If there are new messages, list sender
      and subject for each, one per line.

  calendar:
    enabled: false
    interval_seconds: 300
    prompt: >
      Check my calendar for events starting in the next 15 minutes.
      Reply with JSON array: [{"id":"...","title":"...","time":"...","location":"..."}].
      If none, reply with [].

heartbeat:
  enabled: true
  interval_seconds: 300
  max_failures: 3

sidecar:
  url: "${SIDECAR_URL:-http://sidecar:3001}"
  timeout_seconds: 7200
  health_path: "/health"
  default_model: "claude-opus-4-6"

ratelimiter:
  rpm: ${RATE_LIMIT_RPM:-100}
  itpm: ${RATE_LIMIT_ITPM:-80000}
  otpm: ${RATE_LIMIT_OTPM:-16000}
  safety_margin: 0.90

# PostgreSQL (local host instance with pgvector)
postgres_url: "${POSTGRES_URL}"

# Ollama (containerized, embeddings + 7B LLM)
ollama_url: "${OLLAMA_URL:-http://ollama:11434}"
ollama_embed_model: "nomic-embed-text"
ollama_llm_model: "qwen2.5:7b"

# Context builder settings
context:
  recent_turns: 20         # per-message enrichment (enriched user prompt)
  replay_messages: 30      # conversation replay on new session (system prompt)
  semantic_hits: 5         # max semantic search results per message
  min_similarity: 0.75     # minimum cosine similarity threshold

# Triage settings (local LLM pre-processing)
triage:
  enabled: true
  auto_learn: true
  max_auto_facts: 200
  min_importance: 4

# Agent/command sync between Claude Code and OpenCode directories
opencode:
  model: "opencode-go/glm-5"

agent_sync:
  enabled: true
  # Directories default to ${WORK_DIR}/.claude/agents etc. if not set
