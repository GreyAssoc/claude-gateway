# Gateway configuration
# Cron schedules use standard cron syntax: min hour day month weekday

database:
  path: "data/gateway.db"

skills:
  dirs:
    - "harness/skills"   # framework-agnostic (Gmail, Calendar, …) — every model
    - "skills"           # workspace / Claude Code skills (mounted from .claude/skills)
  agent_dirs:
    - "/app/agents"      # .claude/agents (folder chat agents + leftover DNA)
    - "/workspace/.claude/agents"

memory:
  bootstrap_dir: "memory/bootstrap"
  profiles_dir: "memory/profiles"
  daily_dir: "memory/daily"
  max_curated_inject: 20
  max_daily_days: 7
  claude_md_paths:
    - "/workspace/CLAUDE.md"
    - "/workspace/projects/CLAUDE.md"

orchestrator:
  # Coding review teams: workspace/.claude/teams/coding/…
  # Design/research DNA may still live under .claude/agents/.
  agent_dna_dir: "/app/teams"
  timeout_seconds: 3600

dashboard:
  enabled: true
  port: 8080

# Default backend is CRON_FRAMEWORK (qwen). Per job you can set:
#   agent: grey-website          # folder under .claude/agents/
#   framework: deepseek-flash    # qwen | deepseek | deepseek-flash | grok | claude
#   model: deepseek-flash        # optional raw vendor id
cron:
  morning_briefing:
    schedule: "0 7 * * 1-5"
    prompt: >
      Check my Gmail for urgent unread messages from the last 12 hours,
      check my calendar for today's events, and give me a concise morning
      briefing. Keep it short — bullet the top 3 priorities.
    enabled: true

  end_of_day:
    schedule: "0 18 * * 1-5"
    prompt: >
      Summarize what happened today: important emails received, calendar
      events completed, and any action items I should follow up on tomorrow.
    enabled: true

  weekly_review:
    schedule: "0 9 * * 1"
    prompt: >
      Check my Google Drive for files modified in the last week in my
      Projects folder. Summarize key changes and flag anything that
      needs attention this week.
    enabled: true

  memory_compaction:
    schedule: "0 0 * * *"
    prompt: "__INTERNAL_MEMORY_COMPACT__"
    enabled: true

  home_solar_battery:
    schedule: "0 20 * * *"
    agent: home-solar
    prompt: >
      Run the evening charge-settings procedure now: (a) fetch tomorrow's PV
      forecast, (b) pick the charge tier and APPLY it to the inverter with
      set-inverter-soc.js, (c) generate tomorrow's solar output chart with
      make-solar-chart.js, (d) email Steve the chart PNG as an attachment, and
      (e) message Steve a concise text briefing — forecast summary, the charge
      tier, and whether the inverter save confirmed (OK / UNCERTAIN).
    enabled: true

  paddle_river_cardio:
    schedule: "0 19 * * *"
    agent: paddleboarding
    prompt: >
      Run the next-day paddleboard cardio-paddle report for the River Frome /
      Wareham. The target day is automatically tomorrow because this fires in
      the evening. Run:
        cd /workspace/.claude/agents/paddleboarding && node daily-report.js river
      and paste the full report output to Steve verbatim. Then add a one-line
      verdict: "go / caution / skip" with the best window and the tide
      state. If the fetch fails (exit 3), tell Steve the report is unavailable
      tonight and what failed.
    enabled: true

  paddle_surf:
    schedule: "30 19 * * *"
    agent: paddleboarding
    prompt: >
      Run the next-day surf report for the Poole Bay / Bournemouth coast.
      The target day is automatically tomorrow because this fires in the
      evening. Run:
        cd /workspace/.claude/agents/paddleboarding && node daily-report.js surf
      and paste the full report output to Steve verbatim (top-3 of Lulworth,
      Swanage, Kimmeridge, Bournemouth with their best hour, wave height +
      period, wind chop, and weather). Then add a one-line verdict:
      "best spot tonight is X — worth a paddle / flat and boring". If the
      fetch fails (exit 3), tell Steve the surf report is unavailable tonight
      and what failed.
    enabled: true

  greyandassociates_weekly_serp:
    schedule: "0 17 * * 0"   # Sundays 17:00
    agent: seo
    framework: deepseek-flash
    prompt: >
      Run the weekly Grey & Associates SERP report now by executing:
        python3 -I /workspace/projects/seo/serp-rankings/greyandassociates/run_report.py
      The script pulls live Google SERPs (London, en, desktop, depth 20) for
      all 55 site keywords, including every long-tail town page, writes the
      dated report to serp-rankings/greyandassociates, and emails it to
      steve.w@greyandassociates.co.uk. It is idempotent: if today's report
      already exists it exits without re-sending. Reply with the one-line
      headline only (in top 10 / top 20 / outside top 20).
    enabled: true

watchers:
  gmail:
    enabled: false
    interval_seconds: 120
    prompt: >
      Check Gmail for messages received after {since}. If there are none,
      reply with exactly "NONE". If there are new messages, list sender
      and subject for each, one per line.

  calendar:
    enabled: false
    interval_seconds: 300
    prompt: >
      Check my calendar for events starting in the next 15 minutes.
      Reply with JSON array: [{"id":"...","title":"...","time":"...","location":"..."}].
      If none, reply with [].

heartbeat:
  enabled: true
  interval_seconds: 300
  max_failures: 3

sidecar:
  url: "${SIDECAR_URL:-http://sidecar:3001}"
  timeout_seconds: 7200
  health_path: "/health"
  default_model: "claude-opus-4-6"

ratelimiter:
  # RPM is the only shared minute cap. Token totals are per conversation,
  # sized to that framework's context window (DeepSeek Pro 128k, Flash 1M,
  # Grok 2M, Claude 200k, Qwen 131k). itpm/otpm are not a shared pool;
  # they remain so older env files still parse.
  rpm: ${RATE_LIMIT_RPM:-100}
  itpm: ${RATE_LIMIT_ITPM:-80000}
  otpm: ${RATE_LIMIT_OTPM:-16000}
  safety_margin: 0.90

# PostgreSQL (local host instance with pgvector)
postgres_url: "${POSTGRES_URL}"

# Ollama (containerized, embeddings + 7B LLM)
ollama_url: "${OLLAMA_URL:-http://ollama:11434}"
ollama_embed_model: "nomic-embed-text"
ollama_llm_model: "qwen2.5:7b"

# Context builder settings
context:
  recent_turns: 20         # per-message enrichment (enriched user prompt)
  replay_messages: 30      # conversation replay on new session (system prompt)
  semantic_hits: 5         # max semantic search results per message
  min_similarity: 0.75     # minimum cosine similarity threshold

# Triage settings (local LLM pre-processing)
triage:
  enabled: true
  auto_learn: true
  max_auto_facts: 200
  min_importance: 4

# Agent/command sync between Claude Code and OpenCode directories
opencode:
  model: "opencode-go/glm-5"

agent_sync:
  enabled: true
  # Directories default to ${WORK_DIR}/.claude/agents etc. if not set
