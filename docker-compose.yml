services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    env_file: .env
    environment:
      - TZ=Europe/London
      - SIDECAR_URL=http://sidecar:3001
      - DB_PATH=/app/data/gateway.db
      # WORK_DIR must match the sidecar's mount point, not the host path.
      # The sidecar has the workspace at /workspace — gateway sends this as cwd.
      - WORK_DIR=/workspace
      # PostgreSQL (local host instance via Docker host networking)
      - POSTGRES_URL=postgresql://gateway:${POSTGRES_PASSWORD}@host.docker.internal:5432/gateway?sslmode=disable
      # Ollama (host instance, embeddings + 7B LLM)
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-qwen2.5:7b}
      # OpenCode backend (used when FRAMEWORK=opencode)
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - OPENCODE_MODEL=${OPENCODE_MODEL:-opencode-go/kimi-k2.5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gateway-data:/app/data
      - ${WORK_DIR}/.claude/skills:/app/skills:ro
      - ./memory:/app/memory
      - ./configs:/app/configs
      # Agent DNA files for orchestrator (read-only)
      - ${WORK_DIR}/.claude/agents:/app/agents:ro
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      sidecar:
        condition: service_healthy
    restart: unless-stopped

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    environment:
      - SIDECAR_PORT=3001
      - WORK_DIR=/workspace
      # Prevent IPv6 DNS resolution stalls when talking to Telegram/Claude APIs.
      # Without this, Node.js may attempt IPv6 first, stall for 10-60s, then
      # fall back to IPv4.
      - NODE_OPTIONS=--dns-result-order=ipv4first
      # gog CLI for Google Workspace access (Gmail, Calendar, Drive, Sheets)
      - GOG_ACCOUNT=steve.w@greyandassociates.co.uk
      - GOG_KEYRING_BACKEND=file
      - GOG_KEYRING_PASSWORD=${GOG_KEYRING_PASSWORD}
      # Gemini API key (for SoC audio transcription)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Host workspace — mounted so Claude Code can read/write project files
      - ${WORK_DIR}:/workspace
      # Client data directories (read-only — for skills that read/copy client data)
      - /home/stevew/grey-unraid/clients-current:/clients/current:ro
      - /home/stevew/grey-unraid/clients-past:/clients/past:ro
      # Claude OAuth credentials — mounted read-only, copied to writable /root/.claude at startup
      - ${CLAUDE_CONFIG_DIR}:/root/.claude-ro:ro
      # gog CLI config & keyring (read-only, copied to writable dir at startup)
      - ${HOME}/.config/gogcli:/root/.config/gogcli-ro:ro
      # SSH keys (read-only, copied to writable /root/.ssh at startup)
      - ${HOME}/.ssh:/root/.ssh-ro:ro
      # CUPS printing (host printer access via socket)
      - /var/run/cups/cups.sock:/var/run/cups/cups.sock
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  gateway-data:
