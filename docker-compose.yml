services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    env_file: .env
    environment:
      - SIDECAR_URL=http://sidecar:3001
      - DB_PATH=/app/data/gateway.db
      # WORK_DIR must match the sidecar's mount point, not the host path.
      # The sidecar has the workspace at /workspace — gateway sends this as cwd.
      - WORK_DIR=/workspace
    volumes:
      - gateway-data:/app/data
      - ./skills:/app/skills
      - ./memory:/app/memory
      - ./configs:/app/configs
      # Agent DNA files for orchestrator (read-only)
      - ${WORK_DIR}/.claude/agents:/app/agents:ro
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      sidecar:
        condition: service_healthy
    restart: unless-stopped

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    environment:
      - SIDECAR_PORT=3001
      - WORK_DIR=/workspace
    volumes:
      # Host workspace — mounted so Claude Code can read/write project files
      - ${WORK_DIR}:/workspace
      # Claude OAuth credentials — subscription auth (no API key)
      - ${CLAUDE_CONFIG_DIR}:/root/.claude:ro
      # Google Workspace MCP tokens (optional)
      - ./google-tokens:/root/.config/workspace-mcp
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  gateway-data:
