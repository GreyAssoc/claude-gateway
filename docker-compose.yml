services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    env_file: .env
    environment:
      - TZ=Europe/London
      - SIDECAR_URL=http://sidecar:3001
      - DB_PATH=/app/data/gateway.db
      # WORK_DIR must match the sidecar's mount point, not the host path.
      # The sidecar has the workspace at /workspace — gateway sends this as cwd.
      - WORK_DIR=/workspace
      # PostgreSQL (local host instance via Docker host networking)
      - POSTGRES_URL=postgresql://gateway:${POSTGRES_PASSWORD}@host.docker.internal:5432/gateway?sslmode=disable
      # Ollama (host instance, embeddings + 7B LLM)
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-qwen2.5:7b}
      # OpenCode backend (used when FRAMEWORK=opencode).
      # API keys come from env_file (.env) — do NOT interpolate ${DEEPSEEK_API_KEY}
      # here. Compose substitutes from the host shell first, which silently
      # overrides the value in .env and was the source of stale DeepSeek 401s.
      - OPENCODE_MODEL=${OPENCODE_MODEL:-opencode-go/kimi-k2.5}
      # Google Workspace OAuth (gog). If unset, the gateway falls back to
      # parsing /root/.config/gog/client_secret.json (mounted from the repo).
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOG_TOKEN_PATH=/root/.config/gog/token.json
      - GOOGLE_CLIENT_SECRET_FILE=/root/.config/gog/client_secret.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gateway-data:/app/data
      # Google Workspace OAuth state — shared with sidecar so refreshes
      # persist across restarts. Named volume so it survives `docker compose down`.
      - gog-tokens:/root/.config/gog
      # Google OAuth client_secret JSON (read-only). Used as a fallback when
      # GOOGLE_CLIENT_ID/SECRET env vars aren't set.
      - ./client_secret.json:/root/.config/gog/client_secret.json:ro
      - ${WORK_DIR}/.claude/skills:/app/skills:ro
      - ./memory:/app/memory
      - ./configs:/app/configs
      # Agent DNA files for orchestrator (read-only)
      - ${WORK_DIR}/.claude/agents:/app/agents:ro
      # Full workspace — needed by OpenCode backend to access all projects.
      # Mirrors the sidecar mount so both frameworks see the same files.
      - ${WORK_DIR}:/workspace
      # Client data directories (read-only — for OpenCode skills that read client data)
      - /home/stevew/grey-unraid/clients-current:/clients/current:ro
      - /home/stevew/grey-unraid/clients-past:/clients/past:ro
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      sidecar:
        condition: service_healthy
    restart: unless-stopped

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      - SIDECAR_PORT=3001
      - WORK_DIR=/workspace
      # Prevent IPv6 DNS resolution stalls when talking to Telegram/Claude APIs.
      # Without this, Node.js may attempt IPv6 first, stall for 10-60s, then
      # fall back to IPv4.
      - NODE_OPTIONS=--dns-result-order=ipv4first
      # gog CLI for Google Workspace (Gmail, Calendar, Drive, Sheets)
      # CHANGED 2026-05-09: token storage moved from a keyring (lost on
      # restart) to a JSON file on a shared volume. No password / keyring
      # backend env vars needed any more — auth is via the gateway's
      # /googleauth Telegram command.
      - GOG_ACCOUNT=steve.w@greyandassociates.co.uk
      - GOG_TOKEN_PATH=/root/.config/gog/token.json
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Gemini API key (for SoC audio transcription)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Provider API keys (DEEPSEEK_API_KEY, GROK_API_KEY, OPENCODE_API_KEY)
      # come from env_file (.env), not ${...} interpolation. Host-shell
      # interpolation was overriding .env and sending a stale DeepSeek key.
      # The sidecar also re-reads this file per request so key rotation does
      # not require a container recreate.
      - GATEWAY_ENV_FILE=/workspace/projects/claude-gateway/.env
      # Ollama is on the host GPU. env_file may already set OLLAMA_URL;
      # force the Docker-reachable hostname so a host-side localhost value
      # cannot hide the 3090 from the sidecar.
      - OLLAMA_URL=http://host.docker.internal:11434
      # vLLM on the host GPU (separate compose, published 8005:8000).
      - VLLM_URL=http://host.docker.internal:8005
      # grey-docs scripts have a guard that refuses direct execution unless
      # they're invoked via an MCP server. No grey-docs MCP server exists, so
      # we override the guard here. Revisit when a real MCP server is built.
      - GREY_DOCS_ALLOW_DIRECT=1
    volumes:
      # Host workspace — mounted so Claude Code can read/write project files
      - ${WORK_DIR}:/workspace
      # Client data directories (read-only — for skills that read/copy client data)
      - /home/stevew/grey-unraid/clients-current:/clients/current:ro
      - /home/stevew/grey-unraid/clients-past:/clients/past:ro
      # SuperGrok / Grok Build session (auth.json). Persists device-code login
      # across recreates. The grok binary itself lives in the image at
      # /usr/local/bin/grok so this volume does not hide it.
      - grok-home:/root/.grok
      # Claude OAuth credentials — mounted read-only, copied to writable /root/.claude at startup
      - ${CLAUDE_CONFIG_DIR}:/root/.claude-ro:ro
      # Google Workspace OAuth state — same named volume the gateway writes to.
      # CHANGED 2026-05-09: was ${HOME}/.config/gogcli (read-only, lost refreshes).
      - gog-tokens:/root/.config/gog
      # OAuth client_secret JSON (read-only). The gog binary loads it as a
      # fallback when GOOGLE_CLIENT_ID/SECRET env vars aren't set.
      - ./client_secret.json:/root/.config/gog/client_secret.json:ro
      # SSH keys (read-only, copied to writable /root/.ssh at startup)
      - ${HOME}/.ssh:/root/.ssh-ro:ro
      # CUPS printing (host printer access via socket)
      - /var/run/cups/cups.sock:/var/run/cups/cups.sock
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  gateway-data:
  # Google Workspace OAuth tokens — written by gateway (/googleauth) and
  # read+refreshed by the sidecar's gog binary. Named so it survives `down`.
  gog-tokens:
  # SuperGrok session (auth.json from `grok login --device-auth`).
  grok-home:
